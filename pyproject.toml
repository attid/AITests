[project]
name = "llm-eval"
version = "0.1.0"
description = "Benchmark LLMs as agent brains over OpenAI-compatible endpoints"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "rich>=13.7",
    "aiofiles>=23.2",
]

[project.scripts]
llm-eval = "llm_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "freezegun>=1.4",
    "ruff>=0.5",
    "pyright>=1.1",
    "pandas>=2.2",
    "types-pyyaml>=6.0",
    "types-aiofiles>=23.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]
"src/llm_eval/cli.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: real-API smoke tests; off by default",
]
addopts = "-v --strict-markers"
