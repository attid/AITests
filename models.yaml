defaults:
  concurrency: 3
  temperature: 0.0
  repeats: 1

# Switched to zai-glm so judge uses a key the user actually has set.
# Change back to gpt-4-1-mini (or any enabled model) when OPENAI_API_KEY is available.
judge:
  model_id: zai-glm

reporting:
  filter:
    avg_score_min: 0.75
    json_ok_rate_min: 0.90
    forbidden_fail_max: 2

models:
  # ---------- existing entries (kept, disabled) ----------

  - id: gpt-4-1-mini
    enabled: false
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    pricing:
      input_per_million: 0.40
      output_per_million: 1.60
    concurrency: 5

  - id: gpt-4-1
    enabled: false
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1
    pricing:
      input_per_million: 2.00
      output_per_million: 8.00

  - id: deepseek-chat
    enabled: false
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    pricing:
      input_per_million: 0.27
      output_per_million: 1.10
    concurrency: 3

  - id: deepseek-reasoner
    enabled: false
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-reasoner
    pricing:
      input_per_million: 0.55
      output_per_million: 2.19
    is_reasoning: true
    concurrency: 2

  - id: claude-haiku-or
    enabled: false
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-3.5-haiku
    use_provider_cost: true
    concurrency: 3

  - id: qwen3-thinking-or
    enabled: false
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3-72b-thinking
    is_reasoning: true
    use_provider_cost: true
    concurrency: 2

  # ---------- new providers ----------
  # NOTE: pricing left unset on new entries -> cost_source=unknown in reports.
  # Fill in input_per_million / output_per_million when you have current rates.
  # Verify exact `model` strings against each provider's docs — they change often.

  # MiniMax M2.x emits <think>...</think> inline (not in reasoning_content),
  # so strip_thinking handles it — but only if not truncated. min_max_tokens
  # gives enough room for the model to close the </think> + write the answer.
  - id: minimax-m1
    enabled: true
    base_url: https://api.minimax.io/v1
    api_key_env: MINIMAX_API_KEY
    model: MiniMax-M2.7
    is_reasoning: true
    min_max_tokens: 1024
    concurrency: 3

  # GLM Coding Plan -> use the coding endpoint, not the general one.
  # All GLM models are reasoning models on this plan: they burn tokens on
  # chain-of-thought, so min_max_tokens=1024 keeps room for actual answer.
  - id: zai-glm
    enabled: true
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_env: ZAI_API_KEY
    model: glm-4.6
    is_reasoning: true
    min_max_tokens: 1024
    concurrency: 1

  - id: zai-glm5
    enabled: true
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_env: ZAI_API_KEY
    model: glm-5
    is_reasoning: true
    min_max_tokens: 1024
    concurrency: 1

  - id: zai-glm5.1
    enabled: true
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_env: ZAI_API_KEY
    model: glm-5.1
    is_reasoning: true
    min_max_tokens: 1024
    concurrency: 1

  - id: zai-glm5Turbo
    enabled: true
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_env: ZAI_API_KEY
    model: GLM-5-Turbo
    is_reasoning: true
    min_max_tokens: 1024
    concurrency: 1


  # /coding/v1 is gated by User-Agent: must look like a known coding agent.
  - id: kimi-k2
    enabled: true
    base_url: https://api.kimi.com/coding/v1
    api_key_env: KIMI_API_KEY
    model: kimi-k2-0905-preview
    concurrency: 3
    extra_headers:
      User-Agent: claude-code/1.0

  # OpenRouter — additional models the user requested.
  # use_provider_cost: true picks up usage.cost from each response.

  - id: mimo-pro-or
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: xiaomi/mimo-v2.5-pro
    use_provider_cost: true
    concurrency: 3

  - id: qwen3-plus-or
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3.6-plus
    use_provider_cost: true
    concurrency: 3

  - id: deepseek-v4-flash-or
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: deepseek/deepseek-v4-flash
    use_provider_cost: true
    concurrency: 3

  - id: tencent-hy3-or
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: tencent/hy3-preview:free
    use_provider_cost: true
    concurrency: 3

  # Ollama Cloud — using OpenAI-compatible /v1 endpoint. https://ollama.com/api/tags
  # Available cloud models (suffix -cloud): gpt-oss:20b-cloud, gpt-oss:120b-cloud,
  # qwen3-coder:480b-cloud, deepseek-v3.1:671b-cloud. Verify on docs.ollama.com/cloud.

  - id: ollama-gpt-oss
    enabled: true
    base_url: https://ollama.com/v1
    api_key_env: OLAMA_API_KEY
    model: gpt-oss:120b:cloud
    concurrency: 2

  - id: ollama-deepseek-v4-pro
    enabled: true
    base_url: https://ollama.com/v1
    api_key_env: OLAMA_API_KEY
    model: deepseek-v4-pro:cloud
    concurrency: 2
