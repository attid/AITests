defaults:
  concurrency: 3
  temperature: 0.0
  repeats: 1

# Switched to zai-glm so judge uses a key the user actually has set.
# Change back to gpt-4-1-mini (or any enabled model) when OPENAI_API_KEY is available.
judge:
  model_id: zai-glm

reporting:
  filter:
    avg_score_min: 0.75
    json_ok_rate_min: 0.90
    forbidden_fail_max: 2

models:
  # ---------- existing entries (kept, disabled) ----------

  - id: gpt-4-1-mini
    enabled: false
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    pricing:
      input_per_million: 0.40
      output_per_million: 1.60
    concurrency: 5

  - id: gpt-4-1
    enabled: false
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1
    pricing:
      input_per_million: 2.00
      output_per_million: 8.00

  - id: deepseek-chat
    enabled: false
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    pricing:
      input_per_million: 0.27
      output_per_million: 1.10
    concurrency: 3

  - id: deepseek-reasoner
    enabled: false
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-reasoner
    pricing:
      input_per_million: 0.55
      output_per_million: 2.19
    is_reasoning: true
    concurrency: 2

  - id: claude-haiku-or
    enabled: false
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-3.5-haiku
    use_provider_cost: true
    concurrency: 3

  - id: qwen3-thinking-or
    enabled: false
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3-72b-thinking
    is_reasoning: true
    use_provider_cost: true
    concurrency: 2

  # ---------- new providers ----------
  # NOTE: pricing left unset on new entries -> cost_source=unknown in reports.
  # Fill in input_per_million / output_per_million when you have current rates.
  # Verify exact `model` strings against each provider's docs — they change often.

  - id: minimax-m1
    enabled: true
    base_url: https://api.minimax.chat/v1
    api_key_env: MINIMAX_API_KEY
    model: MiniMax-M1
    concurrency: 3

  - id: zai-glm
    enabled: true
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    model: glm-4.6
    concurrency: 3

  - id: kimi-k2
    enabled: true
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
    model: kimi-k2-0905-preview
    concurrency: 3

  - id: ollama-local
    enabled: true
    base_url: http://localhost:11434/v1
    api_key_env: OLAMA_API_KEY
    model: llama3.1:8b
    pricing:
      input_per_million: 0.0
      output_per_million: 0.0
    concurrency: 2
